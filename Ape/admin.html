
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>ApeBazar.lk Advertisement Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--navy:#102a56;--gold:#f4bd35;--bg:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#18243a}
header{background:var(--navy);color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header strong{font-size:19px}
button,select,input,textarea{font:inherit;padding:9px;border:1px solid #d6dce7;border-radius:7px}
button{cursor:pointer;background:var(--navy);color:white;border:0;font-weight:bold}
button.gold{background:var(--gold);color:var(--navy)}
button.red{background:#b42318}
button.green{background:#16803c}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:950px;margin:auto;padding:8px}
.panel{background:white;border-radius:9px;padding:10px;margin-bottom:8px;box-shadow:0 2px 8px #102a5610}
h2{margin:0 0 8px;color:var(--navy);font-size:20px}
select,input,textarea{width:100%;margin:4px 0 8px;background:white}
textarea{min-height:75px}
label{font-size:13px;font-weight:bold;display:block}
.item{border:1px solid #e1e6ef;border-radius:8px;padding:10px;margin:7px 0;overflow-wrap:anywhere}
.item p{white-space:pre-wrap;margin:6px 0;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.actions button{flex:1;min-width:90px}
.small{font-size:12px;color:#65738a}
#notice{padding:10px;border-radius:7px;margin:8px 0;display:none;overflow-wrap:anywhere}
#login{max-width:430px;margin:35px auto;text-align:center}
.hidden{display:none!important}
.badge{display:inline-block;background:#fff0c2;color:#745200;padding:4px 8px;border-radius:20px;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#googleButton{display:flex;justify-content:center;margin:12px auto}
.ad-photo{display:block;width:100%;max-height:320px;object-fit:contain;background:#f3f6fb;border-radius:6px;margin-bottom:8px}
.topbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.topbar select{flex:1;min-width:145px;margin:0}
#refresh{white-space:nowrap}
#who{font-size:12px;color:#fff}
@media(max-width:420px){
 header{padding:10px}
 header strong{font-size:16px}
 main{padding:5px}
 .panel{padding:8px}
 .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
<strong>🛒 ApeBazar.lk Admin</strong>
<div class="topbar">
<span id="who"></span>
<button id="logout" class="gold hidden" type="button">Logout</button>
</div>
</header>

<section id="login" class="panel">
<h2>Administrator Login</h2>
<p>Sign in with an authorized Google account.</p>
<div id="googleButton"></div>
<p class="small">Only authorized administrator accounts can access this panel.</p>
</section>

<main id="app" class="hidden">
<div id="notice" role="status" aria-live="polite"></div>

<section class="panel">
<h2>Advertisements</h2>
<div class="topbar">
<select id="adFilter" aria-label="Filter advertisements">
<option value="PENDING">Pending Ads</option>
<option value="APPROVED">Approved Ads</option>
<option value="REJECTED">Rejected Ads</option>
<option value="ALL">All Advertisements</option>
</select>
<button id="refresh" type="button">Refresh</button>
</div>
<div id="adList" style="margin-top:8px">Loading advertisements…</div>
</section>
</main>

<script>
"use strict";

const API="https://apebazar-admin-api.createlk.workers.dev";
const GOOGLE_CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";

let authToken=sessionStorage.getItem("apebazar_admin_token")||"";
let me=null;
const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const money=n=>"LKR "+Number(n||0).toLocaleString("en-LK");

function notice(message,error=false){
 $("notice").textContent=message;
 $("notice").style.display="block";
 $("notice").style.background=error?"#fee4e2":"#dcfae6";
 $("notice").style.color=error?"#912018":"#05603a";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function api(path,options={}){
 const headers={...(options.headers||{})};
 if(authToken)headers.Authorization="Bearer "+authToken;

 if(options.body&&typeof options.body!=="string"&&!(options.body instanceof FormData)){
  headers["Content-Type"]="application/json";
  options={...options,body:JSON.stringify(options.body)};
 }

 const r=await fetch(API+path,{...options,headers});
 let data={};
 try{data=await r.json()}catch{}
 if(!r.ok)throw Error(data.error||data.message||("Request failed: "+r.status));
 return data;
}

function loginSuccess(response){
 authToken=response.token;
 me=response.user||{};
 if(!authToken)throw Error("Authentication token was not returned.");

 sessionStorage.setItem("apebazar_admin_token",authToken);
 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("logout").classList.remove("hidden");
 $("who").textContent=me.email||"Administrator";
 loadAds().catch(e=>notice(e.message,true));
}

async function googleCredential(response){
 try{
  notice("Signing in…");
  const result=await api("/api/admin/google-login",{
   method:"POST",
   body:{credential:response.credential}
  });
  $("notice").style.display="none";
  loginSuccess(result);
 }catch(e){
  notice(e.message,true);
 }
}

function logout(){
 authToken="";
 me=null;
 sessionStorage.removeItem("apebazar_admin_token");
 $("app").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("logout").classList.add("hidden");
 $("who").textContent="";
 $("adList").textContent="Sign in to manage advertisements.";
 if(window.google?.accounts?.id)google.accounts.id.disableAutoSelect();
}

$("logout").addEventListener("click",logout);
$("refresh").addEventListener("click",()=>loadAds().catch(e=>notice(e.message,true)));
$("adFilter").addEventListener("change",()=>loadAds().catch(e=>notice(e.message,true)));

async function loadAds(){
 $("refresh").disabled=true;
 $("adList").textContent="Loading advertisements…";

 try{
  const d=await api("/api/admin/ads?status="+encodeURIComponent($("adFilter").value));
  const ads=Array.isArray(d.ads)?d.ads:[];

  if(!ads.length){
   $("adList").textContent="No advertisements found.";
   return;
  }

  $("adList").innerHTML=ads.map(a=>{
   const id=Number(a.id);
   const photo=a.image_url||a.photo_url||
    (Array.isArray(a.photos)?a.photos[0]:"");

   return `
   <article class="item">
    ${photo?`<img class="ad-photo" src="${esc(photo)}" alt="Advertisement photo" loading="lazy" onerror="this.style.display='none'">`:""}

    <b>${esc(a.title||"Untitled advertisement")}</b>

    <p>${esc(a.description||"")}</p>

    <p><b>${money(a.price_lkr)}</b></p>

    <p>
     ${esc(a.category_name||"")}
     ${a.district_name?" · "+esc(a.district_name):""}
     ${a.city_name?" · "+esc(a.city_name):""}
    </p>

    <p>
     Seller: ${esc(a.seller_name||"—")}
     ${a.seller_phone?" · "+esc(a.seller_phone):""}
    </p>

    <p>
     Status: <span class="badge">${esc(a.status||"UNKNOWN")}</span>
     · ID ${esc(a.id)}
    </p>

    <details>
     <summary>Edit advertisement</summary>
     <label for="title${id}">Title</label>
     <input id="title${id}" maxlength="120" value="${esc(a.title||"")}">

     <label for="desc${id}">Description</label>
     <textarea id="desc${id}">${esc(a.description||"")}</textarea>

     <label for="price${id}">Price (LKR)</label>
     <input id="price${id}" type="number" min="0" step="1" value="${Number(a.price_lkr||0)}">

     <button type="button" onclick="editAd(${id})">Save Changes</button>
    </details>

    <div class="actions">
     <button class="green" type="button" onclick="moderateAd(${id},'APPROVE')">Approve</button>
     <button class="red" type="button" onclick="rejectAd(${id})">Reject</button>
    </div>
   </article>`;
  }).join("");

 }catch(e){
  $("adList").textContent="Could not load advertisements: "+e.message;
  throw e;
 }finally{
  $("refresh").disabled=false;
 }
}

async function editAd(id){
 try{
  await api("/api/admin/ads/"+id,{
   method:"PUT",
   body:{
    title:$("title"+id).value.trim(),
    description:$("desc"+id).value.trim(),
    price_lkr:Number($("price"+id).value)
   }
  });
  notice("Advertisement updated successfully.");
  await loadAds();
 }catch(e){notice(e.message,true)}
}

async function moderateAd(id,action){
 if(!confirm("Are you sure you want to approve this advertisement?"))return;

 try{
  await api("/api/admin/ads/"+id+"/moderate,{
   method:"POST",
   body:{action}
  });
  notice("Advertisement approved.");
  await loadAds();
 }catch(e){notice(e.message,true)}
}

async function rejectAd(id){
 const reason=prompt("Enter rejection reason:");
 if(reason===null)return;

 try{
  await api("/api/admin/ads/"+id+"/moderate",{
   method:"POST",
   body:{action:"REJECT",reason}
  });
  notice("Advertisement rejected.");
  await loadAds();
 }catch(e){notice(e.message,true)}
}

function initGoogle(){
 if(!window.google?.accounts?.id){
  setTimeout(initGoogle,300);
  return;
 }
 google.accounts.id.initialize({
  client_id:GOOGLE_CLIENT_ID,
  callback:googleCredential,
  auto_select:false
 });
 google.accounts.id.renderButton($("googleButton"),{
  theme:"outline",
  size:"large",
  text:"signin_with",
  shape:"rectangular",
  width:280
 });
}

initGoogle();

if(authToken){
 api("/api/admin/dashboard")
  .then(()=>loginSuccess({token:authToken,user:{email:"Administrator"}}))
  .catch(()=>logout());
}
</script>
</body>
</html>
