
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>My Ads | ApeBazar.lk</title>
<style>
:root{--navy:#102a56;--gold:#d69b16;--bg:#f4f6fa;--text:#182337}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:17px 16px}
.head{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:#fff;text-decoration:none;font-weight:800;font-size:21px}
.brand span{color:var(--gold)}
nav a{color:white;text-decoration:none;margin-left:13px;font-size:14px}
main{max-width:960px;margin:26px auto;padding:0 14px}
h1{margin:0 0 8px;font-size:28px}
.muted{color:#667085;font-size:14px;line-height:1.6}
.panel,.ad{background:#fff;border:1px solid #e2e6ee;border-radius:14px;padding:18px;margin:16px 0}
button,.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.gold{background:var(--gold);color:#171717}
.secondary{background:#edf1f7;color:var(--navy)}
button:disabled{opacity:.55;cursor:default}
.ad{display:grid;grid-template-columns:145px 1fr;gap:16px}
.ad img{width:100%;height:135px;object-fit:cover;border-radius:9px;background:#edf1f7}
.ad h2{font-size:18px;margin:0 0 8px}
.status{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:800;background:#edf1f7;color:#344054}
.status.approved{background:#e2f6e9;color:#17683a}
.status.pending{background:#fff2d2;color:#875b00}
.status.rejected{background:#fde7e7;color:#a52121}
.status.expired{background:#e9e9ed;color:#555}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button,.actions a{font-size:13px}
.detail-photo{max-width:100%;max-height:400px;object-fit:contain;border-radius:10px}
.price{font-size:21px;font-weight:800;color:var(--navy);margin:12px 0}
#message{white-space:pre-wrap}
.hidden{display:none!important}
@media(max-width:560px){
 .head{align-items:flex-start;flex-direction:column}
 nav a{margin:0 12px 0 0}
 .ad{grid-template-columns:1fr}
 .ad img{height:210px}
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header>
  <div class="head">
    <a class="brand" href="/">Ape<span>Bazar</span>.lk</a>
    <nav>
      <a href="/">Browse Ads</a>
      <a href="/Ape/ads.html">My Ads</a>
    </nav>
  </div>
</header>

<main>
  <section id="myPage">
    <h1>My Ads</h1>
    <p class="muted">Manage your listings and check their approval status.</p>

    <div id="loginBox" class="panel hidden">
      <h2>Sign in to view your ads</h2>
      <p class="muted">Use the Google account you used when posting your ads.</p>
      <div id="googleButton"></div>
      <p id="loginMessage" class="muted"></p>
    </div>

    <div id="message" class="panel">Loading your ads...</div>
    <div id="ads"></div>
  </section>

  <section id="publicPage" class="hidden">
    <a href="/" class="muted">← Back to ApeBazar.lk</a>
    <div id="publicAd"></div>
  </section>
</main>

<script>
const PUBLIC_API = "https://apebazar-public-api.createlk.workers.dev";
const MY_ADS_API = "https://apebazar-my-ads.createlk.workers.dev";
const GOOGLE_CLIENT_ID =
  "582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";

const $ = id => document.getElementById(id);
const tokenKey = "apebazar_token";

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function money(value) {
  if (value == null || value === "") return "";
  return "LKR " + Number(value).toLocaleString("en-LK");
}

function safeUrl(value) {
  try {
    const u = new URL(value, location.origin);
    return ["https:", "http:"].includes(u.protocol) ? u.href : "";
  } catch {
    return "";
  }
}

function adLink(ad) {
  return new URL("/Ape/ads.html?id=" + encodeURIComponent(ad.id),
    location.origin).href;
}

async function copyLink(ad) {
  const link = adLink(ad);
  try {
    await navigator.clipboard.writeText(link);
    alert("Ad link copied!");
  } catch {
    prompt("Copy this ad link:", link);
  }
}

function statusClass(status) {
  const value = String(status || "").toLowerCase();
  if (value === "approved") return "approved";
  if (value === "pending") return "pending";
  if (value === "rejected") return "rejected";
  if (value === "expired") return "expired";
  return "";
}

function dateText(value) {
  if (!value) return "—";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString();
}

function setMessage(message) {
  $("message").textContent = message;
  $("message").classList.remove("hidden");
}

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  const token = sessionStorage.getItem(tokenKey);
  if (token) headers.set("Authorization", "Bearer " + token);

  const response = await fetch(MY_ADS_API + path, {
    ...options, headers
  });
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(data.error || "Request failed");
    error.status = response.status;
    throw error;
  }
  return data;
}

function showLogin() {
  $("loginBox").classList.remove("hidden");
  $("message").classList.add("hidden");
  if (window.google?.accounts?.id) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleLogin
    });
    google.accounts.id.renderButton($("googleButton"), {
      theme: "outline",
      size: "large",
      shape: "rectangular",
      text: "signin_with"
    });
  } else {
    $("loginMessage").textContent =
      "Google sign-in is loading. Please refresh this page.";
  }
}

async function handleGoogleLogin(response) {
  $("loginMessage").textContent = "Signing in...";
  try {
    // Reuse the existing public API's Google authentication endpoint.
    const result = await fetch(PUBLIC_API + "/api/auth/google", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({credential: response.credential})
    });

    const data = await result.json().catch(() => ({}));
    if (!result.ok) throw new Error(data.error || "Google sign-in failed");

    const token = data.token || data.session_token ||
      data.access_token || data.session?.token;

    if (!token) {
      throw new Error(
        "Login response did not contain a session token. " +
        "Check the existing Worker response format."
      );
    }

    sessionStorage.setItem(tokenKey, token);
    $("loginBox").classList.add("hidden");
    await loadMyAds();
  } catch (error) {
    $("loginMessage").textContent = error.message;
  }
}

function renderMyAd(ad) {
  const status = String(ad.status || "UNKNOWN").toUpperCase();
  const approved = status === "APPROVED";
  const photo = safeUrl(ad.image_url || ad.photo_url || "");
  const price = ad.ad_type === "JOB"
    ? money(ad.salary_lkr)
    : money(ad.price_lkr);

  const card = document.createElement("article");
  card.className = "ad";

  card.innerHTML = `
    ${photo ? `<img src="${escapeHtml(photo)}" alt=""
      loading="lazy" onerror="this.remove()">` : ""}
    <div>
      <h2>${escapeHtml(ad.title || "Untitled ad")}</h2>
      <span class="status ${statusClass(ad.status)}">${escapeHtml(status)}</span>
      ${price ? `<div class="price">${escapeHtml(price)}</div>` : ""}
      <p class="muted">${escapeHtml(ad.category || "")}
        ${ad.city ? " · " + escapeHtml(ad.city) : ""}
        ${ad.district ? " · " + escapeHtml(ad.district) : ""}</p>
      <p class="muted">Posted: ${escapeHtml(dateText(ad.created_at))}</p>
      <p class="muted">Expiry: ${escapeHtml(dateText(ad.expires_at))}</p>
      <div class="actions">
        ${approved
          ? `<button class="view secondary">View / Share</button>
             <button class="copy gold">Copy Link</button>`
          : `<span class="muted">Your ad link will be publicly available after approval.</span>`}
      </div>
    </div>`;

  if (approved) {
    card.querySelector(".view").addEventListener("click", () => {
      location.href = adLink(ad);
    });
    card.querySelector(".copy").addEventListener("click", () => copyLink(ad));
  }
  return card;
}

async function loadMyAds() {
  $("ads").replaceChildren();
  setMessage("Loading your ads...");

  try {
    const data = await api("/api/my/ads");
    const ads = Array.isArray(data.ads) ? data.ads : [];

    $("message").classList.add("hidden");

    if (!ads.length) {
      setMessage("You have not posted any ads yet.");
      return;
    }

    const fragment = document.createDocumentFragment();
    ads.forEach(ad => fragment.append(renderMyAd(ad)));
    $("ads").append(fragment);
  } catch (error) {
    if (error.status === 401) {
      showLogin();
      return;
    }
    setMessage(error.message || "Could not load your ads.");
  }
}

async function loadPublicAd(id) {
  $("myPage").classList.add("hidden");
  $("publicPage").classList.remove("hidden");
  $("publicAd").textContent = "Loading ad...";

  try {
    const response = await fetch(
      PUBLIC_API + "/api/listings/" + encodeURIComponent(id)
    );
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "This ad is no longer available.");

    const ad = data.ad || data.listing || data;
    if (!ad || !ad.id || !ad.title) {
      throw new Error("This ad is no longer available.");
    }

    const photo = safeUrl(ad.image_url || ad.photo_url || "");
    const price = ad.ad_type === "JOB"
      ? money(ad.salary_lkr)
      : money(ad.price_lkr);
    const phone = String(ad.seller_phone || "").replace(/[^\d+]/g, "");
    const website = safeUrl(ad.website_url);

    $("publicAd").innerHTML = `
      <article class="panel">
        ${photo ? `<img class="detail-photo" src="${escapeHtml(photo)}"
          alt="${escapeHtml(ad.title)}">` : ""}
        <h1 style="margin-top:16px">${escapeHtml(ad.title)}</h1>
        ${price ? `<div class="price">${escapeHtml(price)}</div>` : ""}
        <p class="muted">${escapeHtml(ad.category || "")}
          ${ad.city ? " · " + escapeHtml(ad.city) : ""}
          ${ad.district ? " · " + escapeHtml(ad.district) : ""}</p>
        <p>${escapeHtml(ad.description || "")}</p>
        ${ad.condition ? `<p><b>Condition:</b> ${escapeHtml(ad.condition)}</p>` : ""}
        ${ad.seller_name ? `<p><b>Seller:</b> ${escapeHtml(ad.seller_name)}</p>` : ""}
        <div class="actions">
          ${phone ? `<a class="btn" href="tel:${encodeURIComponent(phone)}">Call Seller</a>
            <a class="btn" href="https://wa.me/${encodeURIComponent(phone.replace(/^\+/, ""))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
          ${website ? `<a class="btn secondary" href="${escapeHtml(website)}" target="_blank" rel="noopener">Website</a>` : ""}
          <button id="shareAd" class="gold">Copy Ad Link</button>
        </div>
      </article>`;

    $("shareAd").addEventListener("click", () => copyLink(ad));
  } catch (error) {
    $("publicAd").innerHTML =
      `<div class="panel"><h2>Ad unavailable</h2><p class="muted">${
        escapeHtml(error.message)
      }</p><a class="btn" href="/">Browse other ads</a></div>`;
  }
}

const params = new URLSearchParams(location.search);
const publicId = params.get("id");

if (publicId) {
  loadPublicAd(publicId);
} else {
  loadMyAds();
}
</script>
</body>
</html>
