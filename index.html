
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApeBazar.lk</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0b1628;--panel:#13233b;--gold:#c5a64b;--text:#f4f7fc;--muted:#aab8cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}
header{position:sticky;top:0;background:#0a1527;border-bottom:1px solid #283c57;z-index:5}
nav{max-width:950px;margin:auto;min-height:62px;padding:8px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;color:white;text-decoration:none;font-size:17px;font-weight:bold;white-space:nowrap}
.brand img{width:36px;height:36px;object-fit:cover;border-radius:7px}
.gold{color:#d9b85c}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--gold);color:#101b2c;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#172a45;color:white;border:1px solid #283c57}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:43px;background:var(--panel);padding:12px;border-radius:8px;min-width:170px;box-shadow:0 8px 20px #0005}
.menu.show{display:grid;gap:12px}
.menu a{color:white;text-decoration:none}
main{max-width:950px;margin:auto;padding:15px}
.hero,.panel{background:var(--panel);border:1px solid #283c57;border-radius:12px;padding:15px;margin-bottom:15px}
.hero{text-align:center}
.hero h1{margin:0 0 8px;font-size:28px}
p,.muted,.status{color:var(--muted)}
input,select,textarea{width:100%;padding:11px;background:#0c192c;color:white;border:1px solid #283c57;border-radius:8px}
input[type=checkbox]{width:auto}
label{display:block;color:var(--muted);margin:10px 0 5px}
.filters,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:15px}
.ad{background:var(--panel);border:1px solid #283c57;border-radius:10px;overflow:hidden;min-width:0}
.ad img{width:100%;height:150px;object-fit:cover}
.ad div{padding:10px;overflow-wrap:anywhere}
.price{color:#d9b85c;font-weight:bold}
footer{text-align:center;padding:20px;color:var(--muted)}
footer a{color:#d9b85c}
[hidden]{display:none!important}
@media(max-width:600px){
nav{gap:7px;padding:8px 10px}.brand{font-size:15px;gap:6px}
.brand img{width:32px;height:32px}nav button{padding:9px 10px}
.grid{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}
.ad img{height:120px}.hero h1{font-size:24px}
}
</style>
</head>
<body>
<header>
<nav>
<a class="brand" href="/">
<img src="https://assets.createlk.com/apebazar/IMG-20261011-WA0001.jpg" alt="ApeBazar logo">
<span>ApeBazar<span class="gold">.lk</span></span>
</a>
<button id="loginBtn" type="button">Sign in</button>
<img id="avatar" width="35" height="35" style="border-radius:50%;object-fit:cover" hidden alt="Profile">
<div class="menu-wrap">
<button class="secondary" type="button" id="menuBtn">☰</button>
<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#post" id="menuPost">Post an Ad</a>
<a href="#recent">Recent Posts</a>
<a href="/Ape/terms.html">Terms & Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>
</nav>
</header>

<main>
<section class="hero">
<h1>Buy & Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Post your ads for free.</p>
<button type="button" id="heroPost">＋ Post a free ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>
<div class="filters">
<div><label for="category">Category</label><select id="category"><option value="">Select category</option></select></div>
<div><label for="district">District</label><select id="district"><option value="">Select district</option></select></div>
<div><label for="q">Search</label><input id="q" placeholder="Search ads"></div>
<button id="searchBtn" type="button">Search</button>
</div>
<div id="browseStatus" class="status"></div>
</section>

<div id="results" class="grid"></div>
<div style="text-align:center;margin-bottom:20px">
<button id="more" class="secondary" hidden>Load more</button>
</div>

<section class="panel" id="post">
<h3>Post a Free Ad</h3>
<div id="signinNote">Please sign in with Google before posting an ad.</div>
<form id="adForm" hidden>
<div class="formgrid">
<div><label>Title *</label><input name="title" required maxlength="120"></div>
<div><label>Price (LKR)</label><input name="price_lkr" type="number" min="0"></div>
<div><label>Category *</label><select name="category_id" id="postCategory" required></select></div>
<div><label>District *</label><select name="district_id" id="postDistrict" required></select></div>
<div><label>Condition</label><select name="condition"><option value="Used">Used</option><option value="New">New</option><option value="Refurbished">Refurbished</option></select></div>
<div><label>Seller name *</label><input name="seller_name" required></div>
<div><label>Phone *</label><input name="seller_phone" required></div>
<div><label>Photos (maximum 5)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>
</div>
<label>Description *</label>
<textarea name="description" required maxlength="5000"></textarea>
<label><input type="checkbox" name="agree" required> I agree to <a href="/Ape/terms.html">Terms & Conditions</a></label>
<button id="submit" type="submit">Submit for approval</button>
</form>
<div id="postStatus" class="status"></div>
</section>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>
<div style="text-align:center;margin:15px">
<button id="moreRecent" class="secondary" hidden>Load more</button>
</div>
</section>
</main>

<footer>© <span id="year"></span> ApeBazar.lk</footer>

<script>
const API="https://apebazar-public-api.createlk.workers.dev";
const GOOGLE_CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const $=id=>document.getElementById(id);

let token=sessionStorage.getItem("apebazar_token")||"";
let user={},offset=0,roffset=0,googleReady=false;

$("year").textContent=new Date().getFullYear();

async function api(path,options={}){
  const headers=new Headers(options.headers||{});
  if(token)headers.set("Authorization","Bearer "+token);
  if(options.body&&!(options.body instanceof FormData)){
    headers.set("Content-Type","application/json");
    options.body=JSON.stringify(options.body);
  }
  const response=await fetch(API+path,{...options,headers});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.error||data.message||"Request failed ("+response.status+")");
  return data;
}

function msg(id,text){$(id).textContent=text}

function authUI(){
  $("loginBtn").hidden=!!token;
  $("avatar").hidden=!token||!user.picture;
  $("logout").hidden=!token;
  $("signinNote").hidden=!!token;
  $("adForm").hidden=!token;
  if(user.picture)$("avatar").src=user.picture;
}

function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,300);return}
  google.accounts.id.initialize({
    client_id:GOOGLE_CLIENT_ID,
    callback:googleCallback
  });
  googleReady=true;
}

function login(){
  if(!googleReady){
    msg("postStatus","Google login is loading. Please try again.");
    initGoogle();
    return;
  }
  google.accounts.id.prompt(notification=>{
    if(notification.isNotDisplayed()||notification.isSkippedMoment()){
      msg("postStatus","Google sign-in was blocked or unavailable. Try again or check Google OAuth settings.");
    }
  });
}

async function googleCallback(response){
  try{
    msg("postStatus","Signing in...");
    const data=await api("/api/auth/google",{
      method:"POST",
      body:{id_token:response.credential}
    });
    if(!data.token)throw Error("Worker did not return a login token.");

    token=data.token;
    sessionStorage.setItem("apebazar_token",token);

    const payload=JSON.parse(atob(
      response.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")
    ));
    user={name:payload.name||"",picture:payload.picture||""};

    authUI();
    if($("adForm").elements.seller_name)
      $("adForm").elements.seller_name.value=user.name;

    msg("postStatus","Signed in successfully. You can post your ad.");
    $("post").scrollIntoView({behavior:"smooth"});
  }catch(error){
    msg("postStatus","Login failed: "+error.message);
  }
}

function signout(event){
  event.preventDefault();
  token="";user={};
  sessionStorage.removeItem("apebazar_token");
  authUI();
  msg("postStatus","Signed out.");
}

function postFreeAd(){
  if(!token){
    msg("postStatus","Please sign in with Google before posting an ad.");
    login();
    return;
  }
  $("post").scrollIntoView({behavior:"smooth"});
  $("adForm").hidden=false;
}

$("loginBtn").addEventListener("click",login);
$("logout").addEventListener("click",signout);
$("heroPost").addEventListener("click",postFreeAd);
$("menuPost").addEventListener("click",event=>{
  event.preventDefault();
  $("menu").classList.remove("show");
  postFreeAd();
});
$("menuBtn").addEventListener("click",()=>$("menu").classList.toggle("show"));
document.addEventListener("click",event=>{
  if(!event.target.closest(".menu-wrap"))$("menu").classList.remove("show");
});

function fill(id,items,label){
  const select=$(id);
  select.replaceChildren(new Option(label,""));
  if(!Array.isArray(items))return;
  items.forEach(item=>{
    if(item.id!=null&&item.name!=null)
      select.add(new Option(item.name,item.id));
  });
}

async function loadOptions(){
  try{
    const [categoryData,locationData]=await Promise.all([
      api("/api/categories"),
      api("/api/locations")
    ]);

    const categories=categoryData.categories||categoryData.data||categoryData;
    const locations=locationData.districts||locationData.locations||locationData.data||locationData;

    ["category","postCategory"].forEach(id=>fill(id,categories,"Select category"));
    ["district","postDistrict"].forEach(id=>fill(id,locations,"Select district"));
  }catch(error){
    msg("browseStatus","Could not load categories/districts: "+error.message);
  }
}

function listingArray(data){
  if(Array.isArray(data))return data;
  for(const key of ["listings","ads","results","data","items"]){
    if(Array.isArray(data[key]))return data[key];
  }
  return [];
}

function makeCard(ad){
  const card=document.createElement("article");
  card.className="ad";

  let photos=ad.photos||[];
  if(typeof photos==="string"){
    try{photos=JSON.parse(photos)}catch{photos=[]}
  }

  let imageURL=ad.image_url||ad.photo_url||"";
  if(!imageURL&&Array.isArray(photos)&&photos.length){
    const photo=photos[0];
    imageURL=typeof photo==="string"?photo:(photo?.url||photo?.public_url||"");
  }

  if(imageURL){
    const img=document.createElement("img");
    img.src=imageURL;
    img.alt=ad.title||"Advertisement";
    img.loading="lazy";
    img.onerror=()=>img.remove();
    card.append(img);
  }

  const content=document.createElement("div");
  const title=document.createElement("b");
  title.textContent=ad.title||"Untitled ad";
  content.append(title);

  const price=document.createElement("p");
  price.className="price";
  price.textContent=ad.price_lkr==null||ad.price_lkr===""
    ?"Price not specified"
    :Number(ad.price_lkr)===0
      ?"Free / Negotiable"
      :"LKR "+Number(ad.price_lkr).toLocaleString();
  content.append(price);

  const description=document.createElement("p");
  description.textContent=(ad.description||"").slice(0,140);
  content.append(description);

  const details=document.createElement("small");
  details.textContent=[
    ad.district_name||ad.district||"",
    ad.category_name||ad.category||""
  ].filter(Boolean).join(" · ");
  content.append(details);

  if(ad.seller_phone){
    const p=document.createElement("p");
    const link=document.createElement("a");
    link.href="tel:"+ad.seller_phone;
    link.textContent="Contact seller";
    link.style.color="#d9b85c";
    p.append(link);
    content.append(p);
  }

  card.append(content);
  return card;
}

async function searchAds(loadMore=false){
  if(!$("category").value||!$("district").value){
    msg("browseStatus","Select both category and district to search.");
    return;
  }

  if(!loadMore){
    offset=0;
    $("results").replaceChildren();
  }

  try{
    const params=new URLSearchParams({
      category_id:$("category").value,
      district_id:$("district").value,
      q:$("q").value.trim(),
      limit:"12",
      offset:String(offset)
    });

    const data=await api("/api/listings?"+params.toString());
    const ads=listingArray(data);
    ads.forEach(ad=>$("results").append(makeCard(ad)));
    offset+=ads.length;
    $("more").hidden=ads.length<12;
    msg("browseStatus",ads.length?ads.length+" ads loaded.":"No approved ads found.");
  }catch(error){
    msg("browseStatus","Could not load ads: "+error.message);
  }
}

$("searchBtn").addEventListener("click",()=>searchAds());
$("more").addEventListener("click",()=>searchAds(true));
$("q").addEventListener("keydown",event=>{
  if(event.key==="Enter"){event.preventDefault();searchAds()}
});

async function recent(loadMore=false){
  if(!loadMore){
    roffset=0;
    $("recentResults").replaceChildren();
  }

  try{
    const data=await api("/api/listings?limit=6&offset="+roffset);
    const ads=listingArray(data);
    ads.forEach(ad=>$("recentResults").append(makeCard(ad)));
    roffset+=ads.length;
    $("moreRecent").hidden=ads.length<6;
    msg("recentStatus",ads.length?"Recent ads loaded.":"No approved ads available yet.");
  }catch(error){
    msg("recentStatus","Could not load recent ads: "+error.message);
  }
}

$("moreRecent").addEventListener("click",()=>recent(true));

$("adForm").addEventListener("submit",async event=>{
  event.preventDefault();

  if(!token){
    msg("postStatus","Please sign in before posting.");
    login();
    return;
  }

  const form=event.target;
  const button=$("submit");
  button.disabled=true;

  try{
    const files=[...$("photos").files];
    if(files.length>5)throw Error("Maximum 5 photos allowed.");

    const photos=[];
    for(const file of files){
      if(file.size>5*1024*1024)throw Error("Each photo must be under 5 MB.");
      if(!["image/jpeg","image/png","image/webp"].includes(file.type))
        throw Error("Use JPG, PNG, or WebP photos.");

      const uploadForm=new FormData();
      uploadForm.append("file",file);
      const uploaded=await api("/api/upload",{
        method:"POST",
        body:uploadForm
      });

      if(!uploaded.key)throw Error("Photo upload did not return a key.");
      photos.push(uploaded.key);
    }

    const data=Object.fromEntries(new FormData(form).entries());
    data.price_lkr=data.price_lkr===""?null:Number(data.price_lkr);
    data.photos=photos;
    delete data.agree;

    const result=await api("/api/ads",{
      method:"POST",
      body:data
    });

    form.reset();
    msg("postStatus",result.message||"Ad submitted for admin approval.");
    recent();
  }catch(error){
    msg("postStatus","Submission failed: "+error.message);
  }finally{
    button.disabled=false;
  }
});

authUI();
initGoogle();
loadOptions();
recent();
</script>
</body>
</html>
