
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApeBazar.lk - Buy & Sell in Sri Lanka</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0b1628;--panel:#13233b;--gold:#c5a64b;--text:#f4f7fc;--muted:#aab8cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}
header{position:sticky;top:0;background:#0a1527;border-bottom:1px solid #283c57;z-index:5}
nav{max-width:950px;margin:auto;min-height:62px;padding:8px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;color:white;text-decoration:none;font-size:17px;font-weight:bold}
.brand img{width:36px;height:36px;object-fit:cover;border-radius:7px}
.gold,.price{color:#d9b85c}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--gold);color:#101b2c;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#172a45;color:white;border:1px solid #283c57}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:43px;background:var(--panel);padding:12px;border-radius:8px;min-width:170px;box-shadow:0 8px 20px #0005}
.menu.show{display:grid;gap:12px}
.menu a,footer a{color:var(--gold);text-decoration:none}
main{max-width:950px;margin:auto;padding:15px}
.hero,.panel{background:var(--panel);border:1px solid #283c57;border-radius:12px;padding:15px;margin-bottom:15px}
.hero{text-align:center}
.hero h1{margin:0 0 8px;font-size:28px}
p,.muted,.status{color:var(--muted)}
input,select,textarea{width:100%;padding:11px;background:#0c192c;color:white;border:1px solid #283c57;border-radius:8px}
input[type=checkbox]{width:auto}
label{display:block;color:var(--muted);margin:10px 0 5px}
.filters,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:15px}
.ad{background:var(--panel);border:1px solid #283c57;border-radius:10px;overflow:hidden;min-width:0}
.ad img{width:100%;height:150px;object-fit:cover}
.ad div{padding:10px;overflow-wrap:anywhere}
.price{font-weight:bold}
.ad a{color:var(--gold)}
.ad-banner{background:white;border-radius:8px;padding:10px;margin-bottom:15px;overflow:hidden;text-align:center;min-height:80px}
footer{text-align:center;padding:20px;color:var(--muted)}
[hidden]{display:none!important}
@media(max-width:600px){
 nav{gap:7px;padding:8px 10px}.brand{font-size:15px;gap:6px}
 .brand img{width:32px;height:32px}nav button{padding:9px 10px}
 .grid{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}
 .ad img{height:120px}.hero h1{font-size:24px}
}
</style>
</head>
<body>
<header>
<nav>
<a class="brand" href="/">
<img src="https://assets.createlk.com/apebazar/IMG-20261011-WA0001.jpg" alt="ApeBazar logo">
<span>ApeBazar<span class="gold">.lk</span></span>
</a>
<button id="loginBtn" type="button">Sign in</button>
<img id="avatar" width="35" height="35" style="border-radius:50%;object-fit:cover" hidden alt="Profile">
<div class="menu-wrap">
<button class="secondary" id="menuBtn" type="button">☰</button>
<div class="menu" id="menu">
<a href="#browse">Browse Ads</a>
<a href="#post" id="menuPost">Post an Ad</a>
<a href="#recent">Recent Posts</a>
<a href="/Ape/terms.html">Terms & Conditions</a>
<a href="#" id="logout" hidden>Sign out</a>
</div>
</div>
</nav>
</header>

<main>
<section class="hero">
<h1>Buy & Sell in <span class="gold">Sri Lanka</span></h1>
<p>Discover local deals. Post your ads for free.</p>
<button id="heroPost" type="button">＋ Post a free ad</button>
</section>

<section class="panel" id="browse">
<h3>Browse Ads</h3>
<div class="filters">
<div><label for="category">Category</label><select id="category"><option value="">All categories</option></select></div>
<div><label for="district">District</label><select id="district"><option value="">All districts</option></select></div>
<div><label for="q">Search</label><input id="q" placeholder="Search ads"></div>
<button id="searchBtn" type="button">Search</button>
</div>
<div id="browseStatus" class="status"></div>
</section>

<!-- Adsterra Native Banner -->
<div class="ad-banner">
<script async="async" data-cfasync="false" src="https://pl31875155.profitableratecpmnetwork.com/30f905d14a580630063653aabeccc89e/invoke.js"></script>
<div id="container-30f905d14a580630063653aabeccc89e"></div>
</div>

<div id="results" class="grid"></div>
<div style="text-align:center;margin-bottom:20px">
<button id="more" class="secondary" hidden>Load more</button>
</div>

<section class="panel" id="post">
<h3>Post a Free Ad</h3>
<div id="signinNote">Please sign in with Google before posting an ad.</div>
<form id="adForm" hidden>
<div class="formgrid">
<div><label>Title *</label><input name="title" required maxlength="100"></div>
<div><label>Price (LKR)</label><input name="price_lkr" type="number" min="0"></div>
<div><label>Category *</label><select name="category_id" id="postCategory" required></select></div>
<div><label>District *</label><select name="district_id" id="postDistrict" required></select></div>
<div><label>City (optional)</label><select name="city_id" id="postCity"><option value="">Select city</option></select></div>
<div><label>Condition</label><select name="condition"><option>Used</option><option>New</option><option>Refurbished</option></select></div>
<div><label>Seller name *</label><input name="seller_name" required maxlength="100"></div>
<div><label>Phone *</label><input name="seller_phone" required maxlength="30"></div>
<div><label>Photos (maximum 5)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>
</div>
<label>Description *</label>
<textarea name="description" required maxlength="2000"></textarea>
<label><input type="checkbox" name="agree" required> I agree to <a href="/Ape/terms.html">Terms & Conditions</a></label>
<button id="submit" type="submit">Submit for approval</button>
</form>
<div id="postStatus" class="status"></div>
</section>

<section id="recent">
<h3>Recent Posts</h3>
<div id="recentStatus" class="status">Loading ads...</div>
<div id="recentResults" class="grid"></div>
<div style="text-align:center;margin:15px">
<button id="moreRecent" class="secondary" hidden>Load more</button>
</div>
</section>
</main>

<footer>© <span id="year"></span> ApeBazar.lk</footer>

<script>
const API="https://apebazar-public-api.createlk.workers.dev";
const GOOGLE_CLIENT_ID="582157960266-mvlpmqne90d9q7ja5vuhi3g1aspvtp86.apps.googleusercontent.com";
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem("apebazar_token")||"",user={},offset=0,roffset=0,googleReady=false;
$("year").textContent=new Date().getFullYear();

async function api(path,options={}){
 const headers=new Headers(options.headers||{});
 if(token)headers.set("Authorization","Bearer "+token);
 if(options.body&&!(options.body instanceof FormData)){
  headers.set("Content-Type","application/json");
  options.body=JSON.stringify(options.body);
 }
 const r=await fetch(API+path,{...options,headers});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(data.error||data.message||"Request failed ("+r.status+")");
 return data;
}
function msg(id,text){$(id).textContent=text}
function authUI(){
 $("loginBtn").hidden=!!token;
 $("avatar").hidden=!token||!user.picture;
 $("logout").hidden=!token;
 $("signinNote").hidden=!!token;
 $("adForm").hidden=!token;
 if(user.picture)$("avatar").src=user.picture;
}
function initGoogle(){
 if(!window.google?.accounts?.id){setTimeout(initGoogle,300);return}
 google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:googleCallback});
 googleReady=true;
}
function login(){
 if(!googleReady){msg("postStatus","Google login is loading. Try again.");initGoogle();return}
 google.accounts.id.prompt(n=>{
  if(n.isNotDisplayed()||n.isSkippedMoment())
   msg("postStatus","Google sign-in unavailable. Check your Google OAuth settings or try again.");
 });
}
async function googleCallback(response){
 try{
  msg("postStatus","Signing in...");
  const data=await api("/api/auth/google",{
   method:"POST",
   body:{credential:response.credential}
  });
  if(!data.token)throw Error("Login token missing from server.");
  token=data.token;
  sessionStorage.setItem("apebazar_token",token);
  const payload=JSON.parse(atob(response.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
  user={name:payload.name||"",picture:payload.picture||""};
  authUI();
  $("adForm").elements.seller_name.value=user.name;
  msg("postStatus","Signed in successfully. You can post your ad.");
 }catch(e){msg("postStatus","Login failed: "+e.message)}
}
function signout(e){
 e.preventDefault();token="";user={};
 sessionStorage.removeItem("apebazar_token");
 authUI();msg("postStatus","Signed out.");
}
function postFreeAd(){
 if(!token){msg("postStatus","Please sign in before posting.");login();return}
 $("post").scrollIntoView({behavior:"smooth"});
}
$("loginBtn").onclick=login;
$("logout").onclick=signout;
$("heroPost").onclick=postFreeAd;
$("menuPost").onclick=e=>{e.preventDefault();$("menu").classList.remove("show");postFreeAd()};
$("menuBtn").onclick=()=>$("menu").classList.toggle("show");
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))$("menu").classList.remove("show")});

function fill(id,items,label){
 const s=$(id);s.replaceChildren(new Option(label,""));
 if(Array.isArray(items))items.forEach(x=>{if(x.id!=null&&x.name!=null)s.add(new Option(x.name,x.id))});
}
async function loadOptions(){
 try{
  const [c,d]=await Promise.all([api("/api/categories"),api("/api/locations")]);
  const categories=c.categories||c.data||c;
  const districts=d.districts||d.locations||d.data||d;
  ["category","postCategory"].forEach(id=>fill(id,categories,"All categories"));
  ["district","postDistrict"].forEach(id=>fill(id,districts,"All districts"));
 }catch(e){msg("browseStatus","Could not load options: "+e.message)}
}
$("postDistrict").addEventListener("change",async()=>{
 const id=$("postDistrict").value;
 $("postCity").replaceChildren(new Option("Select city",""));
 if(!id)return;
 try{
  const data=await api("/api/cities?district_id="+encodeURIComponent(id));
  (Array.isArray(data)?data:data.cities||data.data||[]).forEach(c=>$("postCity").add(new Option(c.name,c.id)));
 }catch(e){msg("postStatus","Could not load cities: "+e.message)}
});

function arrayOf(d){
 if(Array.isArray(d))return d;
 for(const k of ["listings","ads","results","data","items"])if(Array.isArray(d[k]))return d[k];
 return [];
}
function makeCard(ad){
 const card=document.createElement("article");card.className="ad";
 let image=ad.image_url||ad.photo_url||"";
 if(image){
  const img=document.createElement("img");img.src=image;img.alt=ad.title||"Ad";img.loading="lazy";img.onerror=()=>img.remove();card.append(img);
 }
 const box=document.createElement("div"),title=document.createElement("b");
 title.textContent=ad.title||"Untitled ad";box.append(title);
 const price=document.createElement("p");price.className="price";
 price.textContent=ad.price_lkr==null||ad.price_lkr===""?"Price not specified":Number(ad.price_lkr)===0?"Free / Negotiable":"LKR "+Number(ad.price_lkr).toLocaleString();
 box.append(price);
 const desc=document.createElement("p");desc.textContent=(ad.description||"").slice(0,140);box.append(desc);
 const details=document.createElement("small");
 details.textContent=[ad.district||ad.district_name||"",ad.category||ad.category_name||""].filter(Boolean).join(" · ");
 box.append(details);
 if(ad.seller_phone){
  const p=document.createElement("p"),a=document.createElement("a");
  a.href="tel:"+ad.seller_phone;a.textContent="Contact seller";p.append(a);box.append(p);
 }
 card.append(box);return card;
}
async function searchAds(more=false){
 if(!more){offset=0;$("results").replaceChildren()}
 try{
  const p=new URLSearchParams();
  if($("q").value.trim())p.set("search",$("q").value.trim());
  if($("category").value)p.set("category",$("category").value);
  if($("district").value)p.set("location",$("district").selectedOptions[0].text);
  const ads=arrayOf(await api("/api/listings?"+p));
  const batch=ads.slice(offset,offset+12);
  batch.forEach(a=>$("results").append(makeCard(a)));
  offset+=batch.length;
  $("more").hidden=offset>=ads.length;
  msg("browseStatus",ads.length?ads.length+" ads found.":"No approved ads found.");
 }catch(e){msg("browseStatus","Could not load ads: "+e.message)}
}
$("searchBtn").onclick=()=>searchAds();
$("more").onclick=()=>searchAds(true);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchAds()}});
$("category").onchange=()=>searchAds();
$("district").onchange=()=>searchAds();

async function recent(more=false){
 if(!more){roffset=0;$("recentResults").replaceChildren()}
 try{
  const ads=arrayOf(await api("/api/listings"));
  const batch=ads.slice(roffset,roffset+6);
  batch.forEach(a=>$("recentResults").append(makeCard(a)));
  roffset+=batch.length;
  $("moreRecent").hidden=roffset>=ads.length;
  msg("recentStatus",ads.length?"Recent ads loaded.":"No approved ads available yet.");
 }catch(e){msg("recentStatus","Could not load recent ads: "+e.message)}
}
$("moreRecent").onclick=()=>recent(true);

$("adForm").onsubmit=async e=>{
 e.preventDefault();
 if(!token){login();return}
 const form=e.target,button=$("submit");button.disabled=true;
 try{
  const files=[...$("photos").files];
  if(files.length>5)throw Error("Maximum 5 photos allowed.");
  const photos=[];
  for(const f of files){
   if(f.size>5*1024*1024)throw Error("Each photo must be under 5 MB.");
   if(!["image/jpeg","image/png","image/webp"].includes(f.type))throw Error("Use JPG, PNG or WebP.");
   const fd=new FormData();fd.append("file",f);
   const uploaded=await api("/api/upload",{method:"POST",body:fd});
   if(uploaded.key)photos.push(uploaded.key);
  }
  const data=Object.fromEntries(new FormData(form).entries());
  data.price_lkr=data.price_lkr===""?null:Number(data.price_lkr);
  data.city_id=data.city_id?Number(data.city_id):null;
  data.category_id=Number(data.category_id);
  data.district_id=Number(data.district_id);
  data.photos=photos;delete data.agree;
  const result=await api("/api/ads",{method:"POST",body:data});
  form.reset();msg("postStatus",result.message||"Ad submitted for approval.");
  recent();
 }catch(e){msg("postStatus","Submission failed: "+e.message)}
 finally{button.disabled=false}
};

authUI();initGoogle();loadOptions();searchAds();recent();
</script>
</body>
</html>
